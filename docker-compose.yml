# Local development database. Postgres major version matches Neon's default
# for new projects (18), so local and deployed behave the same.
services:
  db:
    image: postgres:18
    container_name: journeys-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: journeys
    ports:
      # 5436 on the host: 5432-5434 are taken by other local Postgres
      # instances and 5435 by an h2 console's Postgres server.
      - "5436:5432"
    volumes:
      # postgres:18+ images keep data in a subdirectory of /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d journeys"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
