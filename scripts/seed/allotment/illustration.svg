<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!--
    The demo Journey's one image (ticket 58): plot 14 overgrown on the left,
    Ada's tidy plot 13 on the right, a shed, and bean poles leaning "like
    they have had a long day". Flat shapes only, so it reads at any size.
    Drawn for this repository; public domain.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3f2"/>
      <stop offset="1" stop-color="#eef4ea"/>
    </linearGradient>
  </defs>

  <!-- sky and far hedge -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="180" cy="130" rx="110" ry="40" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="260" cy="118" rx="80" ry="34" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="900" cy="90" rx="130" ry="42" fill="#ffffff" opacity="0.7"/>
  <rect x="0" y="300" width="1200" height="70" fill="#5f8c56"/>
  <path d="M0 330 Q 150 270 300 320 T 600 315 T 900 325 T 1200 310 V 380 H 0 Z" fill="#4f7a49"/>

  <!-- ground -->
  <rect x="0" y="360" width="1200" height="440" fill="#c7b58f"/>
  <path d="M0 360 H 1200 V 800 H 0 Z" fill="#b7a27a"/>
  <!-- central path -->
  <path d="M560 800 L 585 380 H 615 L 640 800 Z" fill="#d9cba6"/>

  <!-- plot 13: Ada's neat rows (right) -->
  <g>
    <rect x="660" y="400" width="500" height="360" fill="#8a6f4a"/>
    <g fill="#5a3e24">
      <rect x="675" y="420" width="470" height="18"/>
      <rect x="675" y="470" width="470" height="18"/>
      <rect x="675" y="520" width="470" height="18"/>
      <rect x="675" y="570" width="470" height="18"/>
      <rect x="675" y="620" width="470" height="18"/>
      <rect x="675" y="670" width="470" height="18"/>
      <rect x="675" y="720" width="470" height="18"/>
    </g>
    <!-- bean poles, upright, with a wigwam -->
    <g stroke="#7a5a35" stroke-width="7" stroke-linecap="round">
      <line x1="720" y1="700" x2="760" y2="440"/>
      <line x1="800" y1="700" x2="760" y2="440"/>
      <line x1="760" y1="700" x2="760" y2="440"/>
      <line x1="880" y1="700" x2="920" y2="440"/>
      <line x1="960" y1="700" x2="920" y2="440"/>
      <line x1="920" y1="700" x2="920" y2="440"/>
    </g>
    <g fill="#3f7d3a">
      <ellipse cx="740" cy="560" rx="40" ry="90"/>
      <ellipse cx="780" cy="600" rx="34" ry="70"/>
      <ellipse cx="900" cy="560" rx="40" ry="90"/>
      <ellipse cx="940" cy="610" rx="34" ry="70"/>
    </g>
    <g fill="#5fae57">
      <ellipse cx="750" cy="520" rx="22" ry="40"/>
      <ellipse cx="910" cy="530" rx="22" ry="40"/>
    </g>
    <!-- lettuces along the front rows -->
    <g fill="#8dc26f">
      <circle cx="700" cy="730" r="18"/><circle cx="745" cy="730" r="18"/><circle cx="790" cy="730" r="18"/>
      <circle cx="835" cy="730" r="18"/><circle cx="880" cy="730" r="18"/><circle cx="925" cy="730" r="18"/>
      <circle cx="970" cy="730" r="18"/><circle cx="1015" cy="730" r="18"/><circle cx="1060" cy="730" r="18"/>
      <circle cx="1105" cy="730" r="18"/>
    </g>
    <!-- watering can, resting -->
    <g transform="translate(1040 640)">
      <rect x="0" y="0" width="48" height="40" rx="6" fill="#5b7c8a"/>
      <path d="M48 12 L 78 -4 L 82 4 L 52 20 Z" fill="#5b7c8a"/>
      <path d="M0 8 Q -18 14 0 30" fill="none" stroke="#5b7c8a" stroke-width="6"/>
    </g>
  </g>

  <!-- plot 14: overgrown (left) -->
  <g>
    <rect x="40" y="400" width="500" height="360" fill="#96a65c"/>
    <!-- long grass: many blades -->
    <g stroke="#6f8a3a" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M60 760 q 10 -80 30 -140"/><path d="M90 760 q -12 -90 6 -150"/><path d="M120 760 q 14 -70 40 -120"/>
      <path d="M150 760 q -6 -100 20 -160"/><path d="M180 760 q 18 -60 30 -130"/><path d="M210 760 q -14 -90 0 -150"/>
      <path d="M240 760 q 16 -80 36 -130"/><path d="M270 760 q -8 -110 14 -170"/><path d="M300 760 q 20 -70 30 -140"/>
      <path d="M330 760 q -12 -90 8 -160"/><path d="M360 760 q 14 -80 34 -130"/><path d="M390 760 q -6 -100 18 -150"/>
      <path d="M420 760 q 16 -70 28 -140"/><path d="M450 760 q -14 -90 4 -160"/><path d="M480 760 q 12 -80 34 -120"/>
      <path d="M510 760 q -10 -100 16 -150"/>
      <path d="M75 700 q 8 -60 26 -110"/><path d="M135 700 q -10 -70 6 -120"/><path d="M195 700 q 14 -60 30 -100"/>
      <path d="M255 700 q -8 -80 12 -130"/><path d="M315 700 q 16 -60 30 -110"/><path d="M375 700 q -12 -70 6 -120"/>
      <path d="M435 700 q 12 -60 26 -100"/><path d="M495 700 q -8 -80 10 -130"/>
    </g>
    <g stroke="#89a34a" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M105 740 q 12 -70 30 -110"/><path d="M165 740 q -12 -80 4 -130"/><path d="M225 740 q 16 -60 34 -110"/>
      <path d="M285 740 q -10 -90 10 -140"/><path d="M345 740 q 18 -60 30 -120"/><path d="M405 740 q -12 -80 6 -130"/>
      <path d="M465 740 q 14 -60 28 -110"/><path d="M525 740 q -10 -80 10 -130"/>
    </g>
    <!-- the yellow flowers in the far corner -->
    <g fill="#e8c23a">
      <circle cx="70" cy="430" r="9"/><circle cx="95" cy="445" r="8"/><circle cx="120" cy="425" r="9"/>
      <circle cx="60" cy="470" r="8"/><circle cx="105" cy="480" r="9"/><circle cx="140" cy="455" r="8"/>
      <circle cx="80" cy="505" r="8"/><circle cx="130" cy="500" r="9"/>
    </g>
    <!-- bean poles leaning like they have had a long day -->
    <g stroke="#7a5a35" stroke-width="7" stroke-linecap="round">
      <line x1="300" y1="700" x2="360" y2="470"/>
      <line x1="360" y1="700" x2="365" y2="475"/>
      <line x1="440" y1="700" x2="368" y2="480"/>
      <line x1="180" y1="700" x2="250" y2="500"/>
      <line x1="265" y1="700" x2="255" y2="505"/>
    </g>
    <!-- rhubarb, red at the base, pushing up anyway -->
    <g>
      <g stroke="#c0392b" stroke-width="9" stroke-linecap="round">
        <line x1="420" y1="700" x2="410" y2="640"/>
        <line x1="455" y1="700" x2="470" y2="645"/>
        <line x1="490" y1="700" x2="500" y2="650"/>
      </g>
      <g fill="#2f7a3f">
        <path d="M410 640 q -60 -40 -40 -90 q 50 -10 70 30 q 20 40 -30 60 Z"/>
        <path d="M470 645 q 60 -50 30 -100 q -50 0 -60 40 q -10 40 30 60 Z"/>
        <path d="M500 650 q 70 -30 60 -80 q -50 -20 -70 20 q -20 40 10 60 Z"/>
      </g>
    </g>
  </g>

  <!-- the shed, on the boundary at the back -->
  <g transform="translate(470 250)">
    <rect x="0" y="60" width="200" height="130" fill="#7d5a3c"/>
    <rect x="0" y="60" width="200" height="130" fill="none" stroke="#5c3f28" stroke-width="4"/>
    <g stroke="#5c3f28" stroke-width="3">
      <line x1="25" y1="60" x2="25" y2="190"/><line x1="50" y1="60" x2="50" y2="190"/>
      <line x1="150" y1="60" x2="150" y2="190"/><line x1="175" y1="60" x2="175" y2="190"/>
    </g>
    <path d="M-15 62 L 100 0 L 215 62 Z" fill="#4a5f6b"/>
    <rect x="72" y="100" width="56" height="90" fill="#3e2a1a"/>
    <circle cx="118" cy="148" r="4" fill="#d9c27a"/>
    <rect x="150" y="90" width="34" height="30" fill="#cfe3f2" stroke="#5c3f28" stroke-width="3"/>
    <!-- Ada's sign -->
    <rect x="8" y="96" width="52" height="22" fill="#f3ead8" stroke="#5c3f28" stroke-width="2"/>
    <text x="34" y="112" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#3e2a1a" letter-spacing="2">ADA</text>
  </g>

  <!-- the key, on the path in the foreground -->
  <g transform="translate(590 720) rotate(-25)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#b08d3c" stroke-width="7"/>
    <rect x="12" y="-4" width="60" height="8" rx="3" fill="#b08d3c"/>
    <rect x="52" y="0" width="7" height="14" fill="#b08d3c"/>
    <rect x="64" y="0" width="7" height="10" fill="#b08d3c"/>
    <path d="M-10 -10 q -30 -20 -50 6" fill="none" stroke="#3f7d3a" stroke-width="4"/>
  </g>
</svg>
